# Example 08: Two-round docking funnel gated by molecule_filter
#
# Round 1 docks the whole library quickly. The first gate keeps poses that
# score <= -6 kcal/mol with most heavy atoms inside the box, ranks molecules by
# their best pose and admits only the top 1% of the candidates that entered
# (e.g. 100 of 10,000), one pose each. Round 2 re-docks those survivors with a
# much higher exhaustiveness, and a second gate admits the final top 10.

name: vina_docking_funnel
description: Fast-dock a library, gate to the top 1%, re-dock carefully, keep the top 10
version: 1.0.0
failure_policy: stop

inputs:
  receptor:
    type: structure.protein
    format: pdb
    source: ../../tests/fixtures/sample_data/receptor.pdb
  library:
    type: molecule.collection
    format: sdf
    source: ../../tests/fixtures/sample_data/ligands.sdf
  binding_site:
    type: binding_site
    format: box
    value:
      center: [10.0, 15.0, 20.0]
      size: [20.0, 20.0, 20.0]

methods:
  - id: fast_dock
    type: vina_docking
    description: Round 1 - cheap docking of the full library
    inputs:
      receptor: pipeline.receptor
      ligands: pipeline.library
      binding_site: pipeline.binding_site
    config:
      exhaustiveness: 4
      num_modes: 3

  - id: gate_1pct
    type: molecule_filter
    description: Admit the top 1% of library molecules to round 2
    inputs:
      molecules: fast_dock.docked_poses
      scores: fast_dock.docking_scores
      binding_site: pipeline.binding_site
    config:
      criteria:
        - {column: affinity_kcal_mol, op: "<=", value: -6.0}
      position_mode: fraction_in_box
      min_fraction_in_box: 0.8
      rank_by: affinity_kcal_mol
      top_percent: 1          # of the molecules that entered this gate
      fail_if_empty: true     # stop instead of handing round 2 nothing

  - id: careful_dock
    type: vina_docking
    description: Round 2 - thorough docking of the survivors
    inputs:
      receptor: pipeline.receptor
      ligands: gate_1pct.filtered_molecules
      binding_site: pipeline.binding_site
    config:
      exhaustiveness: 32
      num_modes: 9

  - id: final_gate
    type: molecule_filter
    description: Keep the ten best molecules
    inputs:
      molecules: careful_dock.docked_poses
      scores: careful_dock.docking_scores
      binding_site: pipeline.binding_site
    config:
      position_mode: centroid_in_box
      rank_by: affinity_kcal_mol
      top_n: 10

outputs:
  hits: final_gate.filtered_molecules
  hit_scores: final_gate.filtered_scores
  round1_report: gate_1pct.report
  final_report: final_gate.report
